name: Change PR Guard

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled

concurrency:
  group: change-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  change-policy:
    name: Change Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate change PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/validate-change-pr.mjs

      - name: Summary
        if: always()
        run: |
          {
            echo "## Change Policy"
            echo ""
            echo "- PR: #${{ github.event.pull_request.number }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
