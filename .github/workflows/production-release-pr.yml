name: Production Release PR

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version without v prefix.
        required: false
  pull_request:
    branches:
      - release
    types:
      - closed

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: production-release-pr
  cancel-in-progress: false

jobs:
  production-release-pr:
    name: Production Release PR
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update production-release PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node .github/scripts/create-production-release-pr.mjs

      - name: Summary
        if: always()
        run: |
          {
            echo "## Production Release PR"
            echo ""
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
