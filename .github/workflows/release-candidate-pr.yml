name: Release Candidate PR

on:
  workflow_dispatch:
  push:
    branches:
      - preview

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-candidate-pr
  cancel-in-progress: false

jobs:
  release-candidate-pr:
    name: Release Candidate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release-candidate PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/create-release-candidate-pr.mjs

      - name: Summary
        if: always()
        run: |
          {
            echo "## Release Candidate PR"
            echo ""
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
