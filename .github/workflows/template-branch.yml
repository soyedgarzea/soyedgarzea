name: Template Branch

on:
  workflow_call:
    inputs:
      release_version:
        description: Release version without v prefix.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version without v prefix.
        required: false

permissions:
  contents: write

concurrency:
  group: template-branch
  cancel-in-progress: false

jobs:
  template-branch:
    name: Template Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate template branch
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node .github/scripts/create-template-branch.mjs

      - name: Summary
        if: always()
        run: |
          {
            echo "## Template Branch"
            echo ""
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
